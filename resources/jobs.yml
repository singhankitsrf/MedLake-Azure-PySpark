resources:
  jobs:
    medlake_batch_pipeline:
      name: medlake-batch-pipeline-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_autoloader
          spark_python_task: {python_file: ../jobs/01_bronze_autoloader.py}
          job_cluster_key: shared_cluster
          libraries: [{whl: ../dist/*.whl}]
        - task_key: silver_curate
          depends_on: [{task_key: bronze_autoloader}]
          spark_python_task: {python_file: ../jobs/03_silver_curate.py}
          job_cluster_key: shared_cluster
          libraries: [{whl: ../dist/*.whl}]
        - task_key: gold_kpis
          depends_on: [{task_key: silver_curate}]
          spark_python_task: {python_file: ../jobs/05_gold_kpis.py}
          job_cluster_key: shared_cluster
          libraries: [{whl: ../dist/*.whl}]
      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 2
            data_security_mode: USER_ISOLATION
