[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "medlake-azure-pyspark"
version = "0.1.0"
description = "Azure Databricks/PySpark lakehouse with streaming, medallion ETL and CI/CD."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pydantic>=2.8"]
[project.optional-dependencies]
spark = ["pyspark>=3.5,<5", "delta-spark>=3.2,<5"]
azure = ["azure-eventhub>=5.12", "azure-identity>=1.17", "azure-storage-file-datalake>=12.16"]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.11", "PyYAML>=6.0", "build>=1.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["jobs/"]
