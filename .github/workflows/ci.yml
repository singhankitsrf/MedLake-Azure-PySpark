name: CI
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint critical Python errors
        run: ruff check src scripts tests --select E9,F63,F7,F82
      - run: mypy src
      - run: pytest -q
      - run: python -m compileall -q src scripts jobs tests
  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  spark-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -e . pyspark==3.5.3
      - run: PYTHONPATH=.:src python scripts/evaluate_local.py --output evaluation/ci_spark.json
      - uses: actions/upload-artifact@v4
        with: {name: spark-evaluation, path: evaluation/ci_spark.json}
